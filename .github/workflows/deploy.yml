name: Deploy

# Runs when code lands on main (for example, when a pull request is merged).
# The "Run workflow" button on the Actions tab also starts it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so GitHub can give this job an OIDC token to prove its identity to AWS.
permissions:
  id-token: write
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to AWS (temporary credentials via OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install infra packages
        working-directory: infra
        run: npm ci

      - name: Deploy with CDK
        working-directory: infra
        run: npx cdk deploy --require-approval never
